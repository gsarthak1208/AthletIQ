<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AthletIQ – Sign in</title>
  <link rel="stylesheet" href="signin.css">
</head>
<body>
  <div class="wrap">
    <h1>Athlet<span>IQ</span></h1>
    <p class="sub">Sign in, create an account, or check if one exists.</p>

    <!-- Tabs -->
    

    <!-- 1. SIGN IN -->
    <div class="card" id="panel-signin">
      <label for="si-email">Email</label>
      <input id="si-email" type="email" autocomplete="email" placeholder="you@example.com">
      <div class="err" id="e-si-email"></div>

      <label for="si-pw">Password</label>
      <input id="si-pw" type="password" autocomplete="current-password">
      <div class="err" id="e-si-pw"></div>

      <button class="btn" id="signin-btn">Sign in</button>
      <div class="msg" id="signin-msg" hidden></div>
    </div>

    <!-- 2. CREATE ACCOUNT -->
    <div class="card" id="panel-create" hidden>
      <label for="name">Full name</label>
      <input id="name" autocomplete="name" placeholder="Alex Morgan">
      <div class="err" id="e-name"></div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
      <div class="err" id="e-email"></div>

      <label for="role">I am a…</label>
      <select id="role">
        <option value="player">Player</option>
        <option value="coach">Coach</option>
        <option value="agency">Sports agency</option>
      </select>

      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      <div class="err" id="e-pw"></div>

      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password">
      <div class="err" id="e-pw2"></div>

      <button class="btn" id="create-btn">Create account</button>
      <div class="msg" id="create-msg" hidden></div>
    </div>

    <!-- 3. CHECK ACCOUNT -->
    <div class="card" id="panel-check" hidden>
      <label for="check-email">Email to look up</label>
      <input id="check-email" type="email" placeholder="you@example.com">
      <div class="err" id="e-check"></div>
      <button class="btn" id="check-btn">Check</button>
      <div class="msg" id="check-msg" hidden></div>
    </div>

    <!-- 4. SHOWN AFTER SIGNING IN -->
    <div class="card" id="panel-welcome" hidden>
      <h2 id="welcome-title"></h2>
      <p id="welcome-text"></p>
      <button class="btn" id="signout-btn">Sign out</button>
    </div>

    <p id="hh"> Don't have a account <a href="create_acc.html" id="oo"> Create one</p></p>
  </div>

  <script src="signin.js"></script>
</body>
</html>
